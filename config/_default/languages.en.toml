    headline = "Empowering Through Tech - Cloud, AWS & AI for career changers and beginners"
    bio = "Suzana Melo is a full-stack engineer and AWS Community Builder who moved into tech in her 40s, after 20+ years in journalism and media leadership in Brazil. She founded The Mentor Gap (thementorgap.org), a free initiative that creates resources for people growing without a mentor, and for new mentors getting started. She also founded the AWS Women’s User Group Sweden, co-organizes the AWS User Groups Skåne and Manaus and AWS Community Day Baltic, and mentors career changers and women in tech through Women Innovating in Cloud Africa (WIICA) and Escola da Nuvem. Her talks, workshops, and mentoring reach tech communities across Europe, West Asia, Africa, Asia-Pacific, and the Americas, in English and Portuguese. Suzana spoke at AWS re:Invent 2024, is studying for a postgraduate specialization in AI and Machine Learning at PUC Minas, and writes about cloud, AWS, and AI for developers and career changers at suzanamelo.com."
