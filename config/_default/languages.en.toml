    headline = "Empowering Through Tech - Cloud, AWS & AI for career changers and beginners"
    bio = "Suzana Melo is a full-stack developer and AWS Cloud Practitioner who transitioned into software development in her 40s without a tech background. She holds a bachelor's degree in Communications and has over 20 years of experience. As a strong advocate for diversity and inclusion, she actively works on initiatives that empower women and underrepresented groups in tech, mentors juniors and graduates, and drives tech community enablement across Europe, West Asia, Africa, Asia-Pacific, and the Americas. Suzana is an AWS Community Builder, founder of the AWS Women's User Group Sweden, and co-organiser of AWS Community Day Baltic. She is enrolled in a postgraduate specialization in AI and Machine Learning at PUC Minas, is a featured speaker at AWS re:Invent 2024, and writes articles reaching 14,000+ readers."
